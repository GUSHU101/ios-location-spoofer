services:
  location-picker:
    build:
      context: ./location-picker
      dockerfile: Dockerfile
    environment:
      TOKEN: ${TOKEN:?Set a random admin token with at least 32 characters}
      READ_TOKEN: ${READ_TOKEN:?Set a different random read-only token with at least 32 characters}
      HOST: 0.0.0.0
      PORT: 8080
      DATA_FILE: /data/loc.json
      TRUST_PROXY: "1"
      SESSION_TTL: ${SESSION_TTL:-43200}
    expose:
      - "8080"
    volumes:
      - location-picker-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    stop_grace_period: 15s
    restart: unless-stopped

volumes:
  location-picker-data:
